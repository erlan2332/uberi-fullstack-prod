app = "uberi-frontend-erlan2332"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    REACT_APP_API_BASE_URL = "https://uberi-backend-erlan2332.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
