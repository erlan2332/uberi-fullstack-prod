services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-1664044922}
    expose:
      - "8082"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
